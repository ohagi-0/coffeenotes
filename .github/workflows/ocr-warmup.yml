# Claude の strict ツールスキーマは初回に文法コンパイルが走り、24 時間使わないとキャッシュが切れて
# 最初の読み取りが 15〜30 秒かかる。12 時間ごとに /api/ocr/warm を叩いて切らさない（費用は 1 回 1 円未満）。
# 合言葉 CRON_SECRET は Vercel の環境変数と同じ値を Secrets に置く。
name: OCR warm-up

on:
  schedule:
    - cron: '30 */12 * * *' # 09:30 / 21:30 JST
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /api/ocr/warm を叩く
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET が Secrets に未設定です"; exit 1
          fi
          body=$(mktemp)
          code=$(curl -s -o "$body" -w '%{http_code}' --max-time 150 -X POST \
            "https://coffee-notes.app/api/ocr/warm" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat "$body"; echo
          [ "$code" = "200" ]
