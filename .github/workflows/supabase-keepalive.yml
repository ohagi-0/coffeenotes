# Supabase Free は 1 週間「データベースの活動」が少ないとプロジェクトが一時停止する（REQUIREMENTS.md §9）。
# 週 2 回の REST の読み取りでは足りず 2026-11-07 に止まったので、毎日 1 回、DB 関数 keepalive_ping() で 1 行書き込む
# （マイグレーション 0007）。anon key は公開前提のキーだが Secrets に置く。
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 09:00 JST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: keepalive_ping() を呼んで 1 行書き込む
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY が Secrets に未設定です"; exit 1
          fi
          body=$(mktemp)
          code=$(curl -s -o "$body" -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code $(cat "$body")"
          [ "$code" = "200" ]
